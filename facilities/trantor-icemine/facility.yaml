id: trantor-icemine
name: Trantor Ice Mine
name_zh: 川陀城冰矿
city: Trantor City
city_zh: 川陀城
region: Hellas Metropolitan Area
region_zh: 希腊城市圈
lon: 67.842
lat: -39.939
operator: Ava Mars
epoch: "2026-09-01T00:00:00Z"
summary: >-
  Water from buried glacial ice. Hot water is pumped down Rodriguez wells, melts a pool in the
  ice, and the melt is pumped back up to treatment, where perchlorate is removed.
story: >-
  Hellas is rich in minerals, and its water far exceeds other low-latitude regions. The mining
  company Ava Mars grew its outpost into a base and proposed the open Trantor City plan,
  built from 2155.
book: https://book.interimm.org/history/mars_immigration/
process:
  - "Hot-water supply at 85 degC from reactor waste heat"
  - "Rodriguez well: 30 m3/h of hot water melts about 21 m3/h of ice (334 kJ/kg latent heat plus warming from -55 degC)"
  - "Melt pool level control and production pumps; the heater string is lowered every 120 days"
  - "Perchlorate in the raw melt, measured by the lab"
