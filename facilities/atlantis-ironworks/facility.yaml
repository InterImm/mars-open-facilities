operator: Atlantis machinery consortium
epoch: "2026-09-01T00:00:00Z"
summary: >-
  Iron and steel for Martian machinery. Hematite pellets are reduced with hydrogen in a shaft
  furnace at 900 degC, without coal or coke, and the sponge iron is melted to steel in an
  electric arc furnace.
story: >-
  Atlantis City grew on rich iron ore at a low latitude into the energy and mining town of
  Amazonis. Many machinery makers built their factories there, though living conditions
  stayed rough.
book: https://book.interimm.org/history/mars_immigration/
process:
  - "Pellet feed of about 20 t/h of hematite"
  - "Hydrogen direct reduction in a shaft furnace (as in HYBRIT), Fe2O3 + 3 H2 -> 2 Fe + 3 H2O"
  - "Metallization measured by the lab every 4 hours, reported an hour later"
  - "Electric arc furnace, about 0.6 MWh per tonne of steel"
