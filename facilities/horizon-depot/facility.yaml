id: horizon-depot
name: Horizon Starport Propellant Depot
name_zh: 视界星港推进剂库
city: Horizon City
city_zh: 视界城
region: Meridiani Metropolitan Area
region_zh: 子午线城市圈
lon: 10.541
lat: 5.467
operator: MREI (Mars Real Estate Industry)
epoch: "2219-09-01T00:00:00Z"
since: 2153
since_note: "With Horizon Starport, finished in 2153."
summary: >-
  The cryogenic tank farms of the largest starport on Mars. Liquid oxygen and liquid methane
  arrive by pipeline and are drawn down when a ship loads: about 2,600 t of LOX and 730 t of
  methane per ship.
story: >-
  Horizon City was built from 2148, with the Martian space elevator going up beside it.
  Horizon Starport, finished in 2153, became the largest starport on Mars, where most cargo
  changes hands.
book: https://book.interimm.org/history/mars_immigration/
process:
  - "LOX tank farm, 3,600 m3 (4,100 t); liquid methane tank farm, 2,700 m3 (1,140 t)"
  - "Zero-boil-off cryocoolers; residual boil-off about 0.05 % per day"
  - "Ship loading draws both farms down from 85 % to about 22 % over 30 hours"
