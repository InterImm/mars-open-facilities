id: procyon-energy
name: Procyon Energy Station
name_zh: 南河城能源站
city: Procyon City
city_zh: 南河城
region: Isidis Metropolitan Area
region_zh: 伊希地城市圈
lon: 84.624
lat: 16.181
operator: IIA (InterImm Agency)
log_transitions: false
epoch: "2219-09-01T11:10:00Z"
since: 2078
since_note: "About 2078: the colonies were nuclear-led by 2080."
summary: >-
  The grid of Procyon City: four heat-pipe fission modules of about 5 MWe each run around the
  clock, and a 12 MWp photovoltaic field adds power by day. Dust in the air cuts the solar
  output, most of all in a dust storm.
story: >-
  Dust storms in spring and autumn hurt the early solar plants, so IIA built wind and nuclear
  stations. By 2080 the colonies ran on nuclear power, with wind and solar in support.
book: https://book.interimm.org/history/mars_immigration/
process:
  - "Four heat-pipe microreactors (about 15 MWt each) with closed Brayton converters, 34 % efficient"
  - "Control drums hold the core outlet at 650 degC; each module is refuelled and inspected about every 300 days"
  - "12 MWp photovoltaic field; output follows the sol and the dust optical depth"
