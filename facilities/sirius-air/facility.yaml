id: sirius-air
name: Sirius Air Works
name_zh: 天狼城空气工厂
city: Sirius City
city_zh: 天狼城
region: Isidis Metropolitan Area
region_zh: 伊希地城市圈
lon: 86.578
lat: 7.439
operator: IIA (InterImm Agency)
epoch: "2026-09-01T00:00:00Z"
summary: >-
  Breathing oxygen for the domes of Sirius City. Solid-oxide stacks, a scaled-up MOXIE, split
  atmospheric CO2 at 800 degC into oxygen and carbon monoxide. The dome atmosphere loop
  keeps the oxygen fraction at 21 %.
story: >-
  Air works, water works and power stations were built together with the greenhouses; with
  them the Isidis colonies could take in more and more settlers.
book: https://book.interimm.org/history/mars_immigration/
process:
  - "CO2 compression and preheating"
  - "Solid-oxide electrolysis stacks, 2 CO2 -> 2 CO + O2, at 800 degC; stacks are replaced about every 180 days"
  - "Dome atmosphere: O2 make-up control, CO2 and pressure monitoring"
