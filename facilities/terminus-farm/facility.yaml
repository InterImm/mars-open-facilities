id: terminus-farm
name: Daoya Farm No. 3
name_zh: 稻芽三号农场
city: Terminus City
city_zh: 端点城
region: Hellas Metropolitan Area
region_zh: 希腊城市圈
lon: 86.896
lat: -38.142
operator: Daoya (稻芽)
log_transitions: false
epoch: "2219-09-01T00:00:00Z"
since: 2158
since_note: "Terminus was built from 2156 to 2158 as a farming city."
summary: >-
  A 2 ha LED-lit growth hall of wheat and soybean. Lights run 16 hours of each sol; air
  temperature and CO2 enrichment follow them, and the crop's growth follows the light and
  the CO2.
story: >-
  Terminus City was designed as a farming city. Daoya, founded there, runs farms in Isidis and
  Hellas and sells improved crops to the nearest Martian cities.
book: https://book.interimm.org/history/mars_immigration/
process:
  - "Photoperiod of 16 h at 600 umol/m2/s, LEDs at about 3 umol/J"
  - "CO2 enrichment to 1,200 ppm when lit, 800 ppm in the dark"
  - "Air temperature 24 degC lit, 18 degC dark"
  - "Biomass growth about 0.6 g of dry matter per mol of photons"
