id: procyon-propellant
name: Procyon Propellant Works
name_zh: 南河城推进剂工厂
city: Procyon City
city_zh: 南河城
region: Isidis Metropolitan Area
region_zh: 伊希地城市圈
lon: 84.624
lat: 16.181
operator: UPI (United Planetary Industries)
epoch: "2026-09-01T00:00:00Z"
summary: >-
  Methane and oxygen for the surface-to-orbit shuttles. Compressors take CO2 from the
  atmosphere, electrolysers split water into hydrogen and oxygen, and a Sabatier reactor
  turns CO2 and hydrogen into methane and water, which goes back to the electrolysers.
story: >-
  The first factory on the Martian surface: it was running before the first pioneers landed
  in 2070, and by 2075 it covered the propellant needed between the surface and orbit.
book: https://book.interimm.org/history/mars_immigration/
process:
  - "Atmospheric CO2 acquisition: freezer and compressor trains"
  - "PEM water electrolysis, about 53 kWh per kg of hydrogen"
  - "Sabatier reactor, CO2 + 4 H2 -> CH4 + 2 H2O, Ru/Al2O3 catalyst at 330 degC"
  - "Liquefaction and storage of CH4 and O2"
